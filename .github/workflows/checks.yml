name: Checks
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan source history for secrets
        run: |
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact
          rm gitleaks gitleaks_8.30.1_linux_x64.tar.gz gitleaks_8.30.1_checksums.txt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: bun run build
  executable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run build:cli ${{ matrix.target }}
      - run: bun run packages/cli/tests/live-smoke.ts "dist/cone-$(bun -p 'require("./package.json").version')-${{ matrix.target }}/cone"
      - run: bun run scripts/package-cli.ts ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: cone-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, executable]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cone-*
          merge-multiple: true
          path: release
      - name: Prepare verified draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(jq -r .version package.json)"
          cat release/*.sha256 > release/SHA256SUMS
          cd release
          sha256sum -c SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Cone $RELEASE_TAG" --notes-file ../docs/RELEASE_0_2.md ./*.tar.gz SHA256SUMS
